services:
  postgres:
    image: postgres:16-alpine
    container_name: ligalytics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ligalytics_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ligalytics123
    ports:
      - "5432:5432"
    volumes:
      - ligalytics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ligalytics_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ligalytics-pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ligalytics.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ligalytics_pgdata:
