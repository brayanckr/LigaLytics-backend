# ==========================================================
# Perfil de test: H2 en memoria (modo PostgreSQL)
# Evita depender de un PostgreSQL local o de Docker en los tests.
# ==========================================================
spring.datasource.url=jdbc:h2:mem:ligalytics;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# ==========================================================
# Configuración de la aplicación
# ==========================================================
ligalytics.ai.model-path=target/test-models/
ligalytics.ai.min-training-matches=8
ligalytics.etl.user-agent=LigaLyticsBot/1.0
ligalytics.cors.allowed-origins=http://localhost:5173
ligalytics.ai.retrain-on-etl=false
ligalytics.ai.test-season-start-year=0
