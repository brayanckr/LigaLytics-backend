spring.application.name=ligalytics

# ==========================================================
# Servidor
# ==========================================================
server.port=${PORT:8080}
server.servlet.context-path=/api

# ==========================================================
# PostgreSQL (servicio 'postgres' de docker-compose)
# Las credenciales pueden sobreescribirse con DB_USERNAME / DB_PASSWORD
# ==========================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ligalytics_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:ligalytics123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# Pool de conexiones HikariCP (instancia única gestionada por Spring)
# ==========================================================
spring.datasource.hikari.pool-name=LigaLyticsHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================================================
# Configuración de la aplicación
# ==========================================================
ligalytics.ai.model-path=models/
ligalytics.ai.min-training-matches=10
ligalytics.ai.cross-validation-folds=10
ligalytics.ai.random-seed=42
ligalytics.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==========================================================
# ETL / Proxy de fuentes externas (caché + reintentos)
# ==========================================================
ligalytics.etl.user-agent=LigaLyticsBot/1.0
ligalytics.etl.cache-dir=data/cache
ligalytics.etl.cache-ttl=24h
ligalytics.etl.max-retries=3
ligalytics.etl.retry-backoff-millis=750
ligalytics.etl.connect-timeout=10s
ligalytics.etl.read-timeout=30s
ligalytics.etl.base-urls.football-data=https://www.football-data.co.uk
ligalytics.etl.base-urls.understat=https://understat.com
ligalytics.etl.base-urls.fbref=https://fbref.com
ligalytics.etl.base-urls.transfermarkt=https://www.transfermarkt.com

# ==========================================================
# Sembrado de datos locales (fixtures) al arrancar el backend.
# OJO: las fixtures son datos SINTETICOS de ejemplo (no son resultados reales);
# solo para desarrollo sin red. Mantener en false para trabajar con datos reales.
# ==========================================================
ligalytics.seed.on-startup=false

# ==========================================================
# Administración (/admin/**)
# Si se define ADMIN_API_KEY, las peticiones deben enviar la cabecera X-Admin-Key.
# Vacía = endpoints abiertos (solo recomendable en desarrollo).
# ==========================================================
ligalytics.admin.api-key=${ADMIN_API_KEY:}

# ==========================================================
# Carga automatica de datos REALES al arrancar
# Si la tabla de partidos esta vacia, descarga las temporadas indicadas de
# football-data.co.uk (SP1 = LaLiga) y entrena los modelos de IA.
# Temporadas: 1819 = 2018-19 ... 2324 = 2023-24 (entrenamiento 2018-23, prueba 2023-24)
# ==========================================================
ligalytics.etl.auto-load.enabled=${AUTO_LOAD_DATA:true}
ligalytics.etl.auto-load.division=SP1
ligalytics.etl.auto-load.seasons=2021,2122,2223,2324,2425,2526
ligalytics.etl.auto-load.extra-sources=true
ligalytics.etl.auto-load.understat-league=La_liga
ligalytics.etl.auto-load.transfermarkt-path=/laliga/startseite/wettbewerb/ES1
ligalytics.etl.min-request-interval=1s

# Calendario y resultados en vivo (football-data.org, plan gratuito con clave).
# Registro gratis: https://www.football-data.org/client/register  -> variable FOOTBALL_DATA_ORG_KEY
ligalytics.fixtures.api-key=${FOOTBALL_DATA_ORG_KEY:}
ligalytics.fixtures.base-url=https://api.football-data.org/v4
ligalytics.fixtures.competition=PD

# Bzzoiro Sports Data: xG por partido (clave gratuita en https://sports.bzzoiro.com)
ligalytics.bzzoiro.api-key=${BZZOIRO_API_KEY:}
ligalytics.bzzoiro.base-url=https://sports.bzzoiro.com/api/v2
ligalytics.bzzoiro.league-id=3

# Football Charts: probabilidades de ganador (modelo Dixon-Coles). Clave gratuita en football-charts.com/developers
ligalytics.footballcharts.api-key=${FOOTBALL_CHARTS_API_KEY:}
ligalytics.footballcharts.base-url=https://footballcharts-backend.onrender.com/api/v1
ligalytics.footballcharts.league=spain1
